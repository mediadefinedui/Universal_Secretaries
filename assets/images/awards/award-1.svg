<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="rainbowRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="70%" stop-color="#242838"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="93%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <linearGradient id="goldLaurel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Laurel Wreath Left & Right -->
  <g fill="url(#goldLaurel)" opacity="0.95">
    <!-- Left Leaves -->
    <path d="M30 65 C22 62 18 72 26 77 C22 84 29 93 35 88 C32 96 42 102 46 95 C46 103 56 108 61 100 C62 108 72 110 75 104 C65 112 50 108 40 98 C30 88 24 75 28 60 Z"/>
    <ellipse cx="22" cy="70" rx="6" ry="3.5" transform="rotate(-30 22 70)"/>
    <ellipse cx="27" cy="83" rx="6.5" ry="3.5" transform="rotate(-15 27 83)"/>
    <ellipse cx="36" cy="95" rx="6.5" ry="3.5" transform="rotate(10 36 95)"/>
    <ellipse cx="48" cy="104" rx="6.5" ry="3.5" transform="rotate(30 48 104)"/>
    
    <!-- Right Leaves -->
    <path d="M130 65 C138 62 142 72 134 77 C138 84 131 93 125 88 C128 96 118 102 114 95 C114 103 104 108 99 100 C98 108 88 110 85 104 C95 112 110 108 120 98 C130 88 136 75 132 60 Z"/>
    <ellipse cx="138" cy="70" rx="6" ry="3.5" transform="rotate(30 138 70)"/>
    <ellipse cx="133" cy="83" rx="6.5" ry="3.5" transform="rotate(15 133 83)"/>
    <ellipse cx="124" cy="95" rx="6.5" ry="3.5" transform="rotate(-10 124 95)"/>
    <ellipse cx="112" cy="104" rx="6.5" ry="3.5" transform="rotate(-30 112 104)"/>
  </g>

  <!-- Outer Ring with Colorful Border -->
  <circle cx="80" cy="74" r="50" fill="url(#rainbowRing)" filter="url(#shadow1)"/>
  <circle cx="80" cy="74" r="45" fill="#161922" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Badge Content -->
  <text x="80" y="60" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" letter-spacing="0.5">TOP 20</text>
  <text x="80" y="74" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.2">LEARNING</text>
  <text x="80" y="85" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.2">SYSTEM</text>
  <text x="80" y="99" text-anchor="middle" fill="url(#goldText)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" letter-spacing="1">2025</text>

  <!-- Bottom Black Banner -->
  <g filter="url(#shadow1)">
    <rect x="36" y="112" width="88" height="16" rx="2" fill="#0f1118"/>
    <rect x="36" y="112" width="88" height="16" rx="2" fill="none" stroke="#f59e0b" stroke-width="0.75"/>
    <text x="80" y="123" text-anchor="middle" fill="#fef3c7" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="6.5" letter-spacing="0.8">THE CRAIG WEISS GROUP</text>
  </g>
</svg>
