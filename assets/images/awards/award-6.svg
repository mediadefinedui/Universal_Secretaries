<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="25%" stop-color="#be123c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="75%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Serrated / Scalloped Seal Edge -->
  <g fill="#1f242e" filter="url(#shadow6)">
    <!-- 24-point saw tooth circle -->
    <path d="M 80 20 L 84 22 L 89 20 L 93 23 L 98 22 L 102 26 L 107 26 L 110 31 L 115 32 L 118 37 L 123 39 L 125 45 L 129 48 L 130 54 L 134 58 L 134 64 L 137 69 L 136 75 L 138 80 L 136 86 L 137 91 L 134 96 L 134 102 L 130 106 L 129 112 L 125 115 L 123 121 L 118 123 L 115 128 L 110 129 L 107 134 L 102 134 L 98 138 L 93 137 L 89 140 L 84 138 L 80 140 L 76 138 L 71 140 L 67 137 L 62 138 L 58 134 L 53 134 L 50 129 L 45 128 L 42 123 L 37 121 L 35 115 L 31 112 L 30 106 L 26 102 L 26 96 L 23 91 L 24 86 L 22 80 L 24 75 L 23 69 L 26 64 L 26 58 L 30 54 L 31 48 L 35 45 L 37 39 L 42 37 L 45 32 L 50 31 L 53 26 L 58 26 L 62 22 L 67 23 L 71 20 L 76 22 Z"/>
  </g>

  <!-- Inner Rings -->
  <circle cx="80" cy="80" r="48" fill="#181c24" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="80" cy="80" r="45" fill="none" stroke="#ffffff" stroke-dasharray="2,2" stroke-width="0.8"/>
  <circle cx="80" cy="80" r="34" fill="#0f1217" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Curved Path for Top Text: TALENTED LEARNING -->
  <path id="curveTalented" d="M 44 80 A 36 36 0 0 1 116 80" fill="none"/>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="7.5" fill="#ffffff" letter-spacing="1">
    <textPath href="#curveTalented" startOffset="50%" text-anchor="middle">
      ★ TALENTED LEARNING ★
    </textPath>
  </text>

  <!-- Center Text -->
  <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="10" letter-spacing="0.5">BEST</text>
  <text x="80" y="80" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="850" font-size="8" letter-spacing="0.5">LEARNING</text>
  <text x="80" y="89" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="850" font-size="8" letter-spacing="0.5">SYSTEM</text>

  <!-- Red Ribbon Across Bottom -->
  <g filter="url(#shadow6)">
    <path d="M22 116 L30 110 L30 122 Z" fill="#4c0519"/>
    <path d="M138 116 L130 110 L130 122 Z" fill="#4c0519"/>

    <rect x="26" y="112" width="108" height="15" rx="1" fill="url(#redRibbon)"/>
    <rect x="26" y="112" width="108" height="15" rx="1" fill="none" stroke="#f43f5e" stroke-width="0.6"/>
    <text x="80" y="122.5" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8" letter-spacing="1.2">AWARDS 2019</text>
  </g>
</svg>
